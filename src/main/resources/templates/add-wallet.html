<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/popup-form.js"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Add New Wallet</h2>
        <form action="/wallet/add" method="post" onsubmit="submitFormAndClosePopup(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                <input type="text" name="name" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Type</label>
                <select name="walletType" id="walletType" required onchange="filterProviders()" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option value="CASH">Cash</option>
                    <option value="BANK">Bank</option>
                    <option value="EWALLET">E-Wallet</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Provider</label>
                <select name="providerId" id="providerId" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <option th:each="provider : ${providers}" 
                            th:value="${provider.id}" 
                            th:text="${provider.name}" 
                            th:attr="data-type=${provider.walletType}"></option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Balance</label>
                <input type="number" name="balance" placeholder="0" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div class="flex space-x-3 pt-4">
                <button type="submit" 
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition duration-200 font-medium">
                    Save
                </button>
                <button type="button" onclick="window.parent !== window ? window.parent.postMessage('closeModal', '*') : window.close()" 
                        class="flex-1 bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition duration-200 font-medium">
                    Cancel
                </button>
            </div>
        </form>
    </div>
    
    <script>
        function filterProviders() {
            const type = document.getElementById('walletType').value;
            const providerSelect = document.getElementById('providerId');
            const options = providerSelect.options;
            let firstVisibleOption = null;
            
            for (let i = 0; i < options.length; i++) {
                const option = options[i];
                if (option.getAttribute('data-type') === type) {
                    option.style.display = '';
                    if (!firstVisibleOption) {
                        firstVisibleOption = option;
                    }
                } else {
                    option.style.display = 'none';
                }
            }
            
            if (firstVisibleOption) {
                providerSelect.value = firstVisibleOption.value;
            }
        }
        
        window.onload = function() {
            filterProviders();
        };
    </script>
</body>
</html>
