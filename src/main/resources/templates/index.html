<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saldoinaja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl" 
         x-data="{
             showAddWallet: false,
             showWalletDetails: false,
             currentWalletId: null,
             showAlert: false,
             alertMessage: '',
             openAddWallet() {
                 this.showAddWallet = true;
             },
             closeAddWallet() {
                 this.showAddWallet = false;
             },
             openWalletDetails(id) {
                 this.currentWalletId = id;
                 this.showWalletDetails = true;
             },
             closeWalletDetails() {
                 this.showWalletDetails = false;
                 this.currentWalletId = null;
             }
         }"
         x-init="
             const urlParams = new URLSearchParams(window.location.search);
             const success = urlParams.get('success');
             if (success) {
                 const messages = {
                     'wallet_added': 'Wallet added successfully!',
                     'wallet_updated': 'Wallet updated successfully!',
                     'wallet_deleted': 'Wallet deleted successfully!'
                 };
                 alertMessage = messages[success] || 'Operation completed successfully!';
                 showAlert = true;
                 setTimeout(() => { showAlert = false; }, 3000);
                 window.history.replaceState({}, '', '/');
             }
         "
         @close-modal-no-reload.window="showAddWallet = false; showWalletDetails = false"
         @reload-page.window="location.reload()">
        
        <!-- Success Alert -->
        <div x-show="showAlert" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 transform translate-y-2"
             x-transition:enter-end="opacity-100 transform translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed top-4 right-4 z-50 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span x-text="alertMessage"></span>
        </div>
        
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Welcome to Saldoinaja</h1>
            <p class="text-gray-600">Manage your wallets and providers</p>
        </div>
        
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-gray-800">Wallets</h2>
                <div class="space-x-3">
                    <button @click="openAddWallet()" 
                            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition duration-200 shadow-sm">
                        + Add Wallet
                    </button>
                    <button onclick="window.location.href='/providers'" 
                            class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition duration-200 shadow-sm">
                        Manage Providers
                    </button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div th:each="wallet : ${wallets}" 
                     class="bg-white border border-gray-200 rounded-lg p-5 hover:shadow-lg transition duration-200 relative">
                    <button th:onclick="'openWalletDetails(' + ${wallet.id} + ')'"
                            @click="openWalletDetails($event.target.getAttribute('onclick').match(/\d+/)[0])"
                            class="absolute top-4 right-4 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded text-sm transition duration-200">
                        Details
                    </button>
                    <h3 class="text-lg font-bold text-gray-900 mb-2 pr-20" th:text="${wallet.name}"></h3>
                    <p class="text-sm text-gray-600 mb-3">
                        <span th:text="${wallet.walletType}"></span> - <span th:text="${wallet.provider.name}"></span>
                    </p>
                    <p class="text-3xl font-bold text-gray-900" th:text="${#numbers.formatInteger(wallet.balance, 1, 'POINT')}"></p>
                </div>
            </div>
        </div>

        <!-- Add Wallet Modal -->
        <div x-show="showAddWallet" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             @click.self="closeAddWallet()"
             class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full max-h-[90vh] overflow-y-auto"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 transform scale-95"
                 x-transition:enter-end="opacity-100 transform scale-100">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-gray-800">Add New Wallet</h2>
                        <button @click="closeAddWallet()" class="text-gray-500 hover:text-gray-700">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    <iframe src="/wallet/add" class="w-full h-96 border-0"></iframe>
                </div>
            </div>
        </div>

        <!-- Wallet Details Modal -->
        <div x-show="showWalletDetails" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             @click.self="closeWalletDetails()"
             class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 transform scale-95"
                 x-transition:enter-end="opacity-100 transform scale-100">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold text-gray-800">Wallet Details</h2>
                        <button @click="closeWalletDetails()" class="text-gray-500 hover:text-gray-700">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                    <iframe :src="'/wallet/details/' + currentWalletId" class="w-full h-96 border-0"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Listen for messages from iframe
        window.addEventListener('message', function(e) {
            if (e.data === 'closeModal') {
                // Close modals without reload
                const event = new CustomEvent('close-modal-no-reload');
                window.dispatchEvent(event);
            } else if (e.data === 'reloadAndClose') {
                location.reload();
            }
        });
    </script>
</body>
</html>
