<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Provider Details</title>
    <script src="/js/popup-form.js"></script>
</head>
<body>
    <h2>Provider Details</h2>
    <form id="providerForm" th:action="@{/provider/edit/{id}(id=${provider.id})}" method="post" onsubmit="submitFormAndClosePopup(event)">
        <div style="background-color: #f8f9fa; padding: 20px; border-radius: 5px; margin: 15px 0;">
            <table style="width: 100%; border-collapse: collapse;">
                <tr>
                    <td style="padding: 8px; font-weight: bold;">Name:</td>
                    <td style="padding: 8px;">
                        <span id="nameDisplay" th:text="${provider.name}"></span>
                        <input type="text" id="nameInput" name="name" th:value="${provider.name}" style="display: none;" required>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 8px; font-weight: bold;">Type:</td>
                    <td style="padding: 8px;">
                        <span id="typeDisplay" th:text="${provider.walletType}"></span>
                        <select id="typeInput" name="walletType" style="display: none;" required>
                            <option value="CASH" th:selected="${provider.walletType == T(id.myproject.saldoinaja.model.enums.WalletType).CASH}">Cash</option>
                            <option value="BANK" th:selected="${provider.walletType == T(id.myproject.saldoinaja.model.enums.WalletType).BANK}">Bank</option>
                            <option value="EWALLET" th:selected="${provider.walletType == T(id.myproject.saldoinaja.model.enums.WalletType).EWALLET}">E-Wallet</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 8px; font-weight: bold;">Preset:</td>
                    <td style="padding: 8px;" th:text="${provider.preset ? 'Yes' : 'No'}"></td>
                </tr>
            </table>
        </div>
    </form>
    
    <div id="detailsView" style="margin-top: 20px;">
        <button id="editBtn" onclick="toggleEdit()" style="background-color: #007bff; color: white; margin-right: 10px;">Edit</button>
        <button id="saveBtn" type="submit" form="providerForm" style="background-color: #28a745; color: white; margin-right: 10px; display: none;">Save</button>
        <button id="cancelBtn" onclick="cancelEdit()" style="background-color: #6c757d; color: white; margin-right: 10px; display: none;">Cancel</button>
        <button onclick="showDeleteConfirm()" style="background-color: #dc3545; color: white; margin-right: 10px;">Delete</button>
        <button onclick="window.close()">Close</button>
    </div>

    <div id="deleteConfirm" style="margin-top: 20px; display: none;">
        <div style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin-bottom: 15px;">
            <strong>Warning:</strong> Are you sure you want to delete this provider? This action cannot be undone!
        </div>
        <form th:action="@{/provider/delete/{id}(id=${provider.id})}" method="post" onsubmit="submitFormAndClosePopup(event)">
            <button type="submit" style="background-color: #dc3545; color: white; margin-right: 10px;">Yes, Delete</button>
            <button type="button" onclick="hideDeleteConfirm()" style="background-color: #6c757d; color: white;">Cancel</button>
        </form>
    </div>

    <script>
        function toggleEdit() {
            document.getElementById('nameDisplay').style.display = 'none';
            document.getElementById('nameInput').style.display = 'inline';
            document.getElementById('typeDisplay').style.display = 'none';
            document.getElementById('typeInput').style.display = 'inline';
            
            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('saveBtn').style.display = 'inline';
            document.getElementById('cancelBtn').style.display = 'inline';
        }

        function cancelEdit() {
            document.getElementById('nameDisplay').style.display = 'inline';
            document.getElementById('nameInput').style.display = 'none';
            document.getElementById('typeDisplay').style.display = 'inline';
            document.getElementById('typeInput').style.display = 'none';
            
            document.getElementById('editBtn').style.display = 'inline';
            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function showDeleteConfirm() {
            document.getElementById('detailsView').style.display = 'none';
            document.getElementById('deleteConfirm').style.display = 'block';
        }

        function hideDeleteConfirm() {
            document.getElementById('detailsView').style.display = 'block';
            document.getElementById('deleteConfirm').style.display = 'none';
        }
    </script>
</body>
</html>
