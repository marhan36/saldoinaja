<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/popup-form.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6" 
         x-data="{
             editing: false,
             showDelete: false
         }">
        
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Wallet Details</h2>
        
        <form id="walletForm" th:action="@{/wallet/edit/{id}(id=${wallet.id})}" method="post" onsubmit="submitFormAndClosePopup(event)">
            <div class="bg-gray-50 rounded-lg p-6 mb-6">
                <table class="w-full">
                    <tr class="border-b border-gray-200">
                        <td class="py-3 pr-4 font-semibold text-gray-700 w-1/3">Name:</td>
                        <td class="py-3">
                            <span x-show="!editing" class="text-gray-900" th:text="${wallet.name}"></span>
                            <input x-show="editing" x-cloak type="text" name="name" th:value="${wallet.name}" 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        </td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="py-3 pr-4 font-semibold text-gray-700">Type:</td>
                        <td class="py-3">
                            <span x-show="!editing" class="text-gray-900" th:text="${wallet.walletType}"></span>
                            <select x-show="editing" x-cloak name="walletType" id="walletTypeSelect" onchange="filterProviders()"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                                <option value="CASH" th:selected="${wallet.walletType == T(id.myproject.saldoinaja.model.enums.WalletType).CASH}">Cash</option>
                                <option value="BANK" th:selected="${wallet.walletType == T(id.myproject.saldoinaja.model.enums.WalletType).BANK}">Bank</option>
                                <option value="EWALLET" th:selected="${wallet.walletType == T(id.myproject.saldoinaja.model.enums.WalletType).EWALLET}">E-Wallet</option>
                            </select>
                        </td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="py-3 pr-4 font-semibold text-gray-700">Provider:</td>
                        <td class="py-3">
                            <span x-show="!editing" class="text-gray-900" th:text="${wallet.provider.name}"></span>
                            <select x-show="editing" x-cloak name="providerId" id="providerSelect"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" required>
                                <option th:each="provider : ${providers}" 
                                        th:value="${provider.id}" 
                                        th:text="${provider.name}" 
                                        th:attr="data-type=${provider.walletType}"
                                        th:selected="${provider.id == wallet.provider.id}"></option>
                            </select>
                        </td>
                    </tr>
                    <tr class="border-b border-gray-200">
                        <td class="py-3 pr-4 font-semibold text-gray-700">Balance:</td>
                        <td class="py-3">
                            <span x-show="!editing" class="text-gray-900 font-semibold" th:text="${#numbers.formatInteger(wallet.balance, 1, 'POINT')}"></span>
                            <input x-show="editing" x-cloak type="number" name="balance" 
                                   th:placeholder="${wallet.balance == 0 ? '0' : ''}"
                                   th:value="${wallet.balance != 0 ? wallet.balance : ''}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </td>
                    </tr>
                    <tr>
                        <td class="py-3 pr-4 font-semibold text-gray-700">Preset:</td>
                        <td class="py-3 text-gray-900" th:text="${wallet.preset ? 'Yes' : 'No'}"></td>
                    </tr>
                </table>
            </div>
        </form>
        
        <div x-show="!showDelete" class="flex space-x-3">
            <button x-show="!editing" @click="editing = true; setTimeout(() => filterProviders(), 10)" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition duration-200">
                Edit
            </button>
            <button x-show="editing" x-cloak type="submit" form="walletForm" 
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition duration-200">
                Save
            </button>
            <button x-show="editing" x-cloak @click="editing = false" 
                    class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition duration-200">
                Cancel
            </button>
            <button @click="showDelete = true" 
                    class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition duration-200">
                Delete
            </button>
            <button onclick="window.parent !== window ? window.parent.postMessage('closeModal', '*') : window.close()" 
                    class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition duration-200">
                Close
            </button>
        </div>

        <div x-show="showDelete" x-cloak class="space-y-4">
            <div class="bg-red-50 border border-red-200 text-red-800 rounded-lg p-4">
                <strong class="font-semibold">Warning:</strong> Are you sure you want to delete this wallet? This action cannot be undone!
            </div>
            <form th:action="@{/wallet/delete/{id}(id=${wallet.id})}" method="post" onsubmit="submitFormAndClosePopup(event)">
                <div class="flex space-x-3">
                    <button type="submit" 
                            class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition duration-200">
                        Yes, Delete
                    </button>
                    <button type="button" @click="showDelete = false" 
                            class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition duration-200">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        function filterProviders() {
            const type = document.getElementById('walletTypeSelect').value;
            const providerSelect = document.getElementById('providerSelect');
            const options = providerSelect.options;
            
            for (let i = 0; i < options.length; i++) {
                const option = options[i];
                if (option.getAttribute('data-type') === type) {
                    option.style.display = '';
                } else {
                    option.style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
