<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wallet Details</title>
    <script src="/js/popup-form.js"></script>
</head>
<body>
    <h2>Wallet Details</h2>
    <form id="walletForm" th:action="@{/wallet/edit/{id}(id=${wallet.id})}" method="post" onsubmit="submitFormAndClosePopup(event)">
        <div style="background-color: #f8f9fa; padding: 20px; border-radius: 5px; margin: 15px 0;">
            <table style="width: 100%; border-collapse: collapse;">
                <tr>
                    <td style="padding: 8px; font-weight: bold;">Name:</td>
                    <td style="padding: 8px;">
                        <span id="nameDisplay" th:text="${wallet.name}"></span>
                        <input type="text" id="nameInput" name="name" th:value="${wallet.name}" style="display: none;" required>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 8px; font-weight: bold;">Type:</td>
                    <td style="padding: 8px;">
                        <span id="typeDisplay" th:text="${wallet.walletType}"></span>
                        <select id="typeInput" name="walletType" style="display: none;" required onchange="filterProviders()">
                            <option value="CASH" th:selected="${wallet.walletType == T(id.myproject.saldoinaja.model.enums.WalletType).CASH}">Cash</option>
                            <option value="BANK" th:selected="${wallet.walletType == T(id.myproject.saldoinaja.model.enums.WalletType).BANK}">Bank</option>
                            <option value="EWALLET" th:selected="${wallet.walletType == T(id.myproject.saldoinaja.model.enums.WalletType).EWALLET}">E-Wallet</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 8px; font-weight: bold;">Provider:</td>
                    <td style="padding: 8px;">
                        <span id="providerDisplay" th:text="${wallet.provider.name}"></span>
                        <select id="providerInput" name="providerId" style="display: none;" required>
                            <option th:each="provider : ${providers}" th:value="${provider.id}" th:text="${provider.name}" 
                                    th:attr="data-type=${provider.walletType}" th:selected="${provider.id == wallet.provider.id}"></option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 8px; font-weight: bold;">Balance:</td>
                    <td style="padding: 8px;">
                        <span id="balanceDisplay" th:text="${wallet.balance}"></span>
                        <input type="number" id="balanceInput" name="balance" th:value="${wallet.balance}" style="display: none;">
                    </td>
                </tr>
                <tr>
                    <td style="padding: 8px; font-weight: bold;">Preset:</td>
                    <td style="padding: 8px;" th:text="${wallet.preset ? 'Yes' : 'No'}"></td>
                </tr>
            </table>
        </div>
    </form>
    
    <div id="detailsView" style="margin-top: 20px;">
        <button id="editBtn" onclick="toggleEdit()" style="background-color: #007bff; color: white; margin-right: 10px;">Edit</button>
        <button id="saveBtn" type="submit" form="walletForm" style="background-color: #28a745; color: white; margin-right: 10px; display: none;">Save</button>
        <button id="cancelBtn" onclick="cancelEdit()" style="background-color: #6c757d; color: white; margin-right: 10px; display: none;">Cancel</button>
        <button onclick="showDeleteConfirm()" style="background-color: #dc3545; color: white; margin-right: 10px;">Delete</button>
        <button onclick="window.close()">Close</button>
    </div>

    <div id="deleteConfirm" style="margin-top: 20px; display: none;">
        <div style="background-color: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin-bottom: 15px;">
            <strong>Warning:</strong> Are you sure you want to delete this wallet? This action cannot be undone!
        </div>
        <form th:action="@{/wallet/delete/{id}(id=${wallet.id})}" method="post" onsubmit="submitFormAndClosePopup(event)">
            <button type="submit" style="background-color: #dc3545; color: white; margin-right: 10px;">Yes, Delete</button>
            <button type="button" onclick="hideDeleteConfirm()" style="background-color: #6c757d; color: white;">Cancel</button>
        </form>
    </div>

    <script>
        function toggleEdit() {
            document.getElementById('nameDisplay').style.display = 'none';
            document.getElementById('nameInput').style.display = 'inline';
            document.getElementById('typeDisplay').style.display = 'none';
            document.getElementById('typeInput').style.display = 'inline';
            document.getElementById('providerDisplay').style.display = 'none';
            document.getElementById('providerInput').style.display = 'inline';
            document.getElementById('balanceDisplay').style.display = 'none';
            document.getElementById('balanceInput').style.display = 'inline';
            
            document.getElementById('editBtn').style.display = 'none';
            document.getElementById('saveBtn').style.display = 'inline';
            document.getElementById('cancelBtn').style.display = 'inline';
            
            filterProviders();
        }

        function cancelEdit() {
            document.getElementById('nameDisplay').style.display = 'inline';
            document.getElementById('nameInput').style.display = 'none';
            document.getElementById('typeDisplay').style.display = 'inline';
            document.getElementById('typeInput').style.display = 'none';
            document.getElementById('providerDisplay').style.display = 'inline';
            document.getElementById('providerInput').style.display = 'none';
            document.getElementById('balanceDisplay').style.display = 'inline';
            document.getElementById('balanceInput').style.display = 'none';
            
            document.getElementById('editBtn').style.display = 'inline';
            document.getElementById('saveBtn').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function filterProviders() {
            const type = document.getElementById('typeInput').value;
            const providerSelect = document.getElementById('providerInput');
            const options = providerSelect.options;
            let firstVisibleOption = null;
            
            for (let i = 0; i < options.length; i++) {
                const option = options[i];
                if (type === '' || option.getAttribute('data-type') === type) {
                    option.style.display = '';
                    if (!firstVisibleOption) {
                        firstVisibleOption = option;
                    }
                } else {
                    option.style.display = 'none';
                }
            }
            
            // Auto-select first available provider
            if (firstVisibleOption) {
                providerSelect.value = firstVisibleOption.value;
            }
        }

        function showDeleteConfirm() {
            document.getElementById('detailsView').style.display = 'none';
            document.getElementById('deleteConfirm').style.display = 'block';
        }

        function hideDeleteConfirm() {
            document.getElementById('detailsView').style.display = 'block';
            document.getElementById('deleteConfirm').style.display = 'none';
        }
    </script>
</body>
</html>
